<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="30" y1="35" x2="90" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="45" y1="50" x2="75" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Hexagon Shape -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#090d16" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Subtle inner background pattern -->
  <circle cx="60" cy="60" r="42" fill="#10b981" fill-opacity="0.04" />
  
  <!-- Modern Stylized Cloud Form -->
  <path d="M42 70 C34 70 28 64 28 56 C28 49 33 43 40 42 C43 32 52 26 62 26 C73 26 82 33 84 43 C91 44 96 50 96 57 C96 64 90 70 82 70 Z" 
        fill="url(#cloudGrad)" 
        fill-opacity="0.95" />

  <!-- Database Cylindrical Disk Stack Inside Cloud -->
  <!-- Top Disk -->
  <ellipse cx="60" cy="55" rx="14" ry="4.5" fill="#090d16" />
  <ellipse cx="60" cy="55" rx="12" ry="3.5" fill="#10b981" />
  
  <!-- Middle Disk -->
  <path d="M46 62 C46 65 52 67 60 67 C68 67 74 65 74 62 L74 66 C74 69 68 71 60 71 C52 71 46 69 46 66 Z" fill="#090d16" />
  <path d="M48 62 C48 64.5 53 66 60 66 C67 66 72 64.5 72 62 L72 65 C72 67.5 67 69 60 69 C53 69 48 67.5 48 65 Z" fill="#06b6d4" />
  
  <!-- Bottom Disk -->
  <path d="M46 71 C46 74 52 76 60 76 C68 76 74 74 74 71 L74 75 C74 78 68 80 60 80 C52 80 46 78 46 75 Z" fill="#090d16" />
  <path d="M48 71 C48 73.5 53 75 60 75 C67 75 72 73.5 72 71 L72 74 C72 76.5 67 78 60 78 C53 78 48 76.5 48 74 Z" fill="#0284c7" />

  <!-- Upward Cloud Sync Arrow -->
  <path d="M60 40 L69 49 L64 49 L64 58 L56 58 L56 49 L51 49 Z" fill="url(#arrowGrad)" />
  
  <!-- Security Dots / Nodes -->
  <circle cx="28" cy="28" r="3" fill="#10b981" />
  <circle cx="92" cy="28" r="3" fill="#06b6d4" />
  <circle cx="60" cy="98" r="3" fill="#10b981" />
</svg>
